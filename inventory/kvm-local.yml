all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_user: sumit
  vars:
    ansible_python_interpreter: /usr/bin/python3.12
    ansible_ssh_common_args: '-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no'
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_user: root

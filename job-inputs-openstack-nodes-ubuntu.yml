- name: ost-ctrl
  variant: ubuntu24.04
  cloud_image: ""
  vcpu: 8
  ram: 10240
  disk_size: 40
  networks:
  - default
  - dataplane
  - external
  cloud_user: "{{ cloud_config.cloud_user }}"
  user_data: "{{ cloud_config.user_data }}"
